<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: hangman-comp-a-spread.png</title>
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f4e9d9}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1536px">
  <div class="r-paper region texture" data-region="paper" style="background-image:url('../../../assets/plates/paper.png');background-repeat:repeat"></div>
  <figure class="r-spine region plate" data-region="spine"><img src="../../../assets/plates/spine.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-hangman-drawing region control" data-region="hangman-drawing"><!-- hand-drawn graphite hangman: gallows base, post, beam and rope complete, stick figure head, body and one arm, eraser smudge trails and faint construction guides; must be code-drawn SVG stroke groups so one group can be revealed per wrong guess: rebuild the control's chrome from the crop (comp-spec.mjs --crop hangman-drawing); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-strike-tally region control" data-region="strike-tally"><!-- red pencil tally hatch marks in the bottom-left corner, one stroke per wrong guess: rebuild the control's chrome from the crop (comp-spec.mjs --crop strike-tally); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-title region text" data-region="title"><!-- handwritten graphite title reading Simon's Hangman --><p style="line-height:1.05;margin:0">title</p></div>
  <div class="r-word-display region text" data-region="word-display"><!-- large handwritten word row: revealed letters E P H N T in firm graphite, hidden letters as hand-drawn underline dashes --><p style="line-height:1.05;margin:0">word-display</p></div>
  <div class="r-status-line region text" data-region="status-line"><!-- handwritten status line reading 3 wrong guesses --><p style="line-height:1.05;margin:0">status-line</p></div>
  <div class="r-letter-rail region control" data-region="letter-rail"><!-- A to Z letter buttons in four rows, each letter above a pencil underline; correct-used letters darker, wrong letters red-struck and dimmed: rebuild the control's chrome from the crop (comp-spec.mjs --crop letter-rail); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-new-word-button region control" data-region="new-word-button"><!-- small hand-drawn rounded-rectangle button reading New word: rebuild the control's chrome from the crop (comp-spec.mjs --crop new-word-button); its ink box, border, fill, radius, and label size are the comp's --></div>
</main>
</body>
</html>
