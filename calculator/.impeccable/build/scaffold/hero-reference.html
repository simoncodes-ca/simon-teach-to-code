<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: yard-a-bolted-plate.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oleo+Script:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#1b1919}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1344px">
  <div class="r-wall region texture" data-region="wall" style="background-image:url('../../../assets/plates/wall.png');background-repeat:repeat"></div>
  <div class="r-title region text" data-region="title"><!-- SIMON'S CALCULATOR spray-stencilled in blocky white caps with stencil bridges --><p style="font-size:var(--r-title-font);font-family:var(--r-title-family),sans-serif;font-weight:var(--r-title-weight);line-height:1.05;margin:0">title</p></div>
  <div class="r-panel-frame region chrome" data-region="panel-frame"><!-- the bolted steel plate: brushed gunmetal frame, bevelled lit top edge, hex bolts at four corners, raised on a cast shadow --></div>
  <div class="r-readout-well region chrome" data-region="readout-well"><!-- recessed dark display well with an inner shadow lip, holding the readout --></div>
  <div class="r-readout region text" data-region="readout"><!-- current number in crisp white blocky digits, right-aligned, largest type on the page --><p style="line-height:1.05;margin:0">readout</p></div>
  <div class="r-keypad region control" data-region="keypad"><!-- extruded square keycaps with visible side walls and contact shadows; green digits, pink operators, cyan equals, orange hazard clear: rebuild the control's chrome from the crop (comp-spec.mjs --crop keypad); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-buffer-panel region chrome" data-region="buffer-panel"><!-- separate bolted panel to the right across a gap of bare wall, same frame and bolts as the calculator --></div>
  <div class="r-buffer-list region control" data-region="buffer-list"><!-- entered terms stacked one per line, hairline rule between lines, numbers white and operators pink: rebuild the control's chrome from the crop (comp-spec.mjs --crop buffer-list); its ink box, border, fill, radius, and label size are the comp's --></div>
</main>
</body>
</html>
